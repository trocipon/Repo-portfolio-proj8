<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Maintenance en cours | Thibaud Rocipon</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --background: #f6f1ea;
        --foreground: #0f1724;
        --primary: #1e3a5f;
        --muted-foreground: #6b7280;
        --border: #e6dfd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #10151f;
          --foreground: #ecf0ea;
          --primary: #4d7099;
          --muted-foreground: #94a3b8;
          --border: #2a3550;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--background);
        color: var(--foreground);
        font-family: "Open Sans", "Segoe UI", sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      main {
        max-width: 32rem;
      }
      .icon {
        width: 3.5rem;
        height: 3.5rem;
        color: var(--primary);
        margin: 0 auto 1rem;
      }
      h1 {
        font-family: "Space Grotesk", "Open Sans", sans-serif;
        font-weight: 700;
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted-foreground);
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
      <h1>Site en maintenance</h1>
      <p>Le portfolio est momentanément indisponible le temps d'une mise à jour. Merci de repasser dans quelques instants.</p>
    </main>
  </body>
</html>
